[project]
name = "oauth-guides-api"
version = "0.1.0"
description = "Agent that investigates OAuth providers and generates evidence-backed setup and approval guides"
authors = [
    { name = "sahit1011", email = "anilsahithvallepu@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.3.0",
    "composio>=0.30.0",
    "composio-anthropic>=0.30.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "sse-starlette>=3.6.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
